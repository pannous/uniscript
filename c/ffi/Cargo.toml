[package]
name = "uniscript-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI of the uniscript crate (header c/uniscript.h, C++ wrapper c/uniscript.hpp)"
license = "MIT"
publish = false

[lib]
name = "uniscript_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
uniscript = { path = "../.." }

[profile.release]
panic = "abort"
# rustc's post-link strip (macOS 27 beta) can misalign the dylib's LINKEDIT string pool: dyld then refuses to load it
strip = "none"
