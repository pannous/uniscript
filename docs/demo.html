<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uniscript demo</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<!-- Converts in the browser with the Rust crate compiled to WebAssembly (wasm/). Serve the repository over HTTP
     (docs/make_demo.sh does, with the installed fonts under /fonts/), file:// cannot load modules. Fonts: README.md.
     Deployed under pannous.com/uniscript/, it uses that page's sliced fonts (../fonts/fonts.css, ../sequence_fonts.js). -->
<style>
@font-face{font-family:UniscriptSans;src:local("Uniscript Sans"),local("UniscriptSans-Regular"),url("../fonts/UniscriptSans-Regular.ttf")}
@font-face{font-family:UniscriptCJK;src:local("Uniscript CJK"),local("UniscriptCJK-Regular"),url("../fonts/UniscriptCJK-Regular.otf")}
@font-face{font-family:Hieroglyphs;src:local("NewGardinerOmni Regular"),local("NewGardinerOmni-Regular"),url("../fonts/NewGardinerOmni4.ttf")}
@font-face{font-family:Aegyptus;src:local("Aegyptus"),url("../fonts/Aegyptus.otf");unicode-range:U+F0000-FFFFD}
:root{--fonts:"Uniscript Sans","NewGardinerOmni","Uniscript CJK",UniscriptSans,Hieroglyphs,Aegyptus,UniscriptCJK}
body{font-family:var(--fonts),sans-serif;background:#fbfaf7;margin:0;color:#222}
#examples{padding:28px 36px 12px} #editor,#warnings,#about{margin-inline:36px} .hero{font-size:150px;line-height:1.15;margin:0 0 10px}
.row{display:flex;gap:28px;align-items:center;margin:6px 0}
.row code{font:15px Menlo,monospace;width:470px;color:#666;flex:none} .out{font-size:42px}
#editor{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-top:24px;max-width:1100px}
textarea,#output{font:18px Menlo,var(--fonts),monospace;min-height:130px;padding:10px;border:1px solid #ccc;border-radius:6px;background:#fff}
#output{font-family:var(--fonts),sans-serif;font-size:32px;white-space:pre-wrap;overflow-wrap:anywhere}
#about{font:14px system-ui,sans-serif;color:#666;margin-top:24px} #about a{color:#7a3b12}
button{font-size:20px;align-self:center} #warnings{color:#a60;font:14px Menlo,monospace;white-space:pre-line;margin-top:8px}
</style>
<div id="examples"><div class="hero" data-uniscript="R <:mirror R> <:red R> <:mirror red R>"></div></div>
<div id="editor">
	<textarea id="source" spellcheck="false">&lt;:alpha> &lt;:fracture Hello> &lt;:double R> \:infinity
&lt;:mirror red R> &lt;:beside 犭 句> &lt;:color #ff8800 angle 90 A></textarea>
	<button id="reverse" title="Unicode → uniscript">⇄</button>
	<div id="output"></div>
</div>
<div id="warnings"></div>
<p id="about">Converted by the Rust crate compiled to WebAssembly, with meta information (fonts, colors, angles) rendered as HTML.
	<a href="https://pannous.com/uniscript/">pannous.com/uniscript</a> instead runs the wasp implementation compiled by warp, with example buttons and a Unicode → uniscript box.</p>
<script type="module">
import init, { convert, ensure, toUniscript, metaRuns, html } from "../wasm/uniscript.js";

const CHUNK_MANIFEST = "../data/chunks/manifest.usxc";

const EXAMPLES = [
	"<:mirror red R>",
	"<:mirror R> <:flip R> <:turn R> <:left R> <:right R>",
	"<:red U><:orange N><:yellow I><:green S><:blue C><:purple R><:pink I><:brown P><:gray T>",
	"<:bold Bold> <:italic italic> <:bold-italic both>",
	"<:fracture Hello> <:double R> <:script Script> <:monospace mono>",
	"<:greek> athos <:/greek> <:alpha> <:infinity> x<:upper 2>",
	"<:red circle> <:brown heart> <:green heart>",
	"<:above 𓀀 𓁐>  <:mirror 𓀀>  <:beside 犭 句>",
];

const examples = document.getElementById("examples");
const hero = examples.querySelector(".hero");
const element = (tag, className, text) => Object.assign(document.createElement(tag), { className, textContent: text });
const unicode = source => convert(source, "lenient").text;
const output = document.getElementById("output");
// the sliced fonts keep IDS, hieroglyph groups and TAG effects in one face; missing when served from the repository.
// Watching before the first output keeps the page from loading plain slices for those sequences.
const sequenceFonts = import("../sequence_fonts.js").then(fonts => fonts.watchSequences(examples, output), () => {});

// the index in chunks fetched on demand: ensure(text) loads what a text needs, then the conversions are synchronous
await init({ chunks: new URL(CHUNK_MANIFEST, import.meta.url) });
await Promise.all([hero.dataset.uniscript, ...EXAMPLES].map(ensure));
hero.textContent = unicode(hero.dataset.uniscript);
for (const source of EXAMPLES) {
	const row = element("div", "row");
	row.append(element("code", "", source), element("span", "out", unicode(source)));
	examples.append(row);
}

const [source, warningList] = ["source", "warnings"].map(id => document.getElementById(id));
async function render() {
	const text = source.value;
	await ensure(text);
	if (source.value !== text) return;
	const converted = convert(text, "lenient");
	const { styled, warnings } = metaRuns(converted.text);
	output.innerHTML = html(styled);
	output.dataset.text = converted.text;
	warningList.textContent = [...converted.warnings, ...warnings].map(warning => `${warning.message} at byte ${warning.at}`).join("\n");
}
source.addEventListener("input", render);
document.getElementById("reverse").addEventListener("click", () => {
	source.value = toUniscript(output.dataset.text);
	render();
});
await render();
await sequenceFonts;
document.body.dataset.ready = "true";
</script>
