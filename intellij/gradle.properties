# IDE to compile and test against: the local installation when present, else downloaded
platformLocalPath=/Applications/IntelliJ IDEA.app
platformVersion=2025.3.1
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
verifyOldestVersion=2024.3.6
# Homebrew openjdk@21 is not registered with /usr/libexec/java_home; elsewhere foojay downloads a JDK 21 (settings.gradle.kts)
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
