[package]
name = "uniscript"
version = "1.0.5"
edition = "2021"
description = "Uniscript: ASCII names for Unicode text (<:alpha> → α, <:fracture A> → 𝔄) and back"
license = "MIT"
repository = "https://github.com/pannous/uniscript"
homepage = "https://pannous.com/uniscript/"
readme = "README.md"
keywords = ["unicode", "entities", "text", "encoding"]
categories = ["text-processing", "encoding"]
# one test crate: tests/main.rs declares every tests/*.rs file as a module
autotests = false
# the crate: the library, the CLI, its data (entities.idx is compiled in, entities/ is the source `uniscript build` reads) and the Rust tests
include = ["/src/**/*.rs", "/data/entities.idx", "/data/entities/**", "/tests/*.rs", "/README.md", "/LICENSE", "/docs/uniscript.md"]

[features]
default = ["embedded-index", "pack"]
# compiles data/entities.idx into the library: Uniscript::default() and the free functions; without it, load the index
# at runtime with Uniscript::from_bytes (the WebAssembly build does)
embedded-index = []
# `uniscript chunks` also writes chunks.pack, the chunks deflated for one multi-range request per round on the web
pack = ["dep:miniz_oxide"]

[[bin]]
name = "uniscript"
path = "src/main.rs"
required-features = ["embedded-index"]
test = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
miniz_oxide = { version = "0.9", optional = true }
