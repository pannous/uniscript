[package]
name = "uniscript"
version = "0.1.0"
edition = "2021"
description = "Uniscript: ASCII names for Unicode text (<:alpha> → α, <:fracture A> → 𝔄) and back"
license = "MIT"
repository = "https://github.com/pannous/uniscript"
keywords = ["unicode", "entities", "text", "encoding"]
categories = ["text-processing", "encoding"]

[features]
default = ["embedded-index"]
# compiles data/entities.idx into the library: Uniscript::default() and the free functions; without it, load the index
# at runtime with Uniscript::from_bytes (the WebAssembly build does)
embedded-index = []

[[bin]]
name = "uniscript"
path = "src/main.rs"
required-features = ["embedded-index"]

[dependencies]
