[package]
name = "uniscript-python-ffi"
version = "0.2.0"
edition = "2021"
description = "Python bindings of the uniscript crate (PyO3)"
license = "MIT"
publish = false

[lib]
name = "_uniscript"
crate-type = ["cdylib"]

[dependencies]
uniscript = { path = "../.." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[profile.release]
# rustc's strip after linking (Xcode 27 beta strip) leaves the string table 4-aligned: dyld refuses the image with
# "mis-aligned LINKEDIT string pool"
strip = "none"
